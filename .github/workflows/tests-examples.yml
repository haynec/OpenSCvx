name: 🧪 Examples Sweep

on:
  release:
    types: [published]  # Run on releases to validate examples
  workflow_dispatch:     # Manual trigger for ad-hoc testing
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC

jobs:
  examples:
    name: Examples Sweep
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # Solving every example is slow

    strategy:
      fail-fast: false  # Continue testing other examples even if one fails
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        # Install the package with every extra the examples exercise
        uv pip install --system -e ".[test,cvxpygen,qpax,mjx,lie,frax,stl]"

    - name: Run examples sweep
      run: |
        pytest -v -m examples --durations=10 -n auto

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: examples-test-results-py${{ matrix.python-version }}-${{ matrix.os }}
        path: |
          .pytest_cache/
          test-results/
        retention-days: 7
